
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Level Five - Barber</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>


        <img src="images/lf.png" alt="Logo" class="logoo" />





    <header>
        <h1>Barber Level Five</h1>
        <p class="subtitulo">Reservaciones</p>
    </header>

    <main>

        <h2>Reserva tu cita</h2>
        <p class="descripcion">
            Completa los datos y selecciona el horario que prefieras.
        </p>

        <section class="formulario">

            <h3>Nombre del cliente <span>(Obligatorio)</span></h3>

            <input
                type="text"
                id="nombre"
                placeholder="Ingresa tu nombre"
                maxlength="100"
                required
            >

            <h3>Fecha de reservación <span>(Obligatorio)</span></h3>

            <input
                type="date"
                id="fecha"
                required
            >

            <h3>Horas disponibles <span>(Obligatorio)</span></h3>

            <p class="ayuda">
                Selecciona uno de los siguientes horarios:
            </p>

            <div id="horariosDisponibles">

                <button type="button" data-hora="08:00">8:00 AM</button>
                <button type="button" data-hora="09:00">9:00 AM</button>
                <button type="button" data-hora="10:00">10:00 AM</button>
                <button type="button" data-hora="11:00">11:00 AM</button>
                <button type="button" data-hora="13:00">1:00 PM</button>
                <button type="button" data-hora="14:00">2:00 PM</button>
                <button type="button" data-hora="15:00">3:00 PM</button>
                <button type="button" data-hora="16:00">4:00 PM</button>

            </div>

            <div class="separador"></div>

            <button type="button" id="btnReservar">
                Reservar cita
            </button>

            <div id="mensaje"></div>

        </section>

    </main>

    <footer>
        <p>developed by Alemán 🜲</p>
    </footer>

    <script type="module" src="js/script.js"></script>

</body>
</html>
